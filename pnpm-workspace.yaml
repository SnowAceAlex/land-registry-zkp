packages:
  - 'blockchain'
  - 'web-app/frontend'
  - 'web-app/backend'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  # Telemetry postinstall pulled in by @nestjs/swagger — nothing depends on it
  # running, so it stays off.
  '@scarf/scarf': false
  blake-hash: true
  bufferutil: true
  keccak: true
  prisma: true
  secp256k1: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
