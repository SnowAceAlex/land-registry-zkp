version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: land_registry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: land_registry
    ports:
      # Host port 5433 → container port 5432
      # Using 5433 to avoid conflict with other local PostgreSQL instances on 5432
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
